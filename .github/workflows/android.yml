name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach APKs to tagged releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, parity, security and LIVE connector tests
        env:
          LIVE_CONNECTORS: "1"
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode release keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.CIPHERPATH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured: release APK will be unsigned; a debug-signed APK is still produced."
          fi

      - name: Build release (R8 + lintVital) and debug APKs
        env:
          CIPHERPATH_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          CIPHERPATH_KEYSTORE_PASSWORD: ${{ secrets.CIPHERPATH_KEYSTORE_PASSWORD }}
          CIPHERPATH_KEY_ALIAS: ${{ secrets.CIPHERPATH_KEY_ALIAS }}
          CIPHERPATH_KEY_PASSWORD: ${{ secrets.CIPHERPATH_KEY_PASSWORD }}
          CIPHERPATH_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Verify APK signatures
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            echo "== $f"; "$BT/apksigner" verify --print-certs "$f" | head -5 || echo "(unsigned)"
          done

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/CipherPath-debug.apk 2>/dev/null || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk ../dist/CipherPath-release.apk; fi
          cp app/build/connector-report-android.md ../dist/ 2>/dev/null || true
          cp -r app/schemas ../dist/room-schemas 2>/dev/null || true
          (cd ../dist && sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cipherpath-apk
          path: dist/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-and-lint-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
