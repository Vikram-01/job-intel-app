name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Unit, integration and security tests
        run: python -m pytest -q
      - name: Static security analysis (bandit)
        run: bandit -q -r app
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly
        run: JOBINTEL_DATABASE_URL=sqlite:///./ci.db alembic upgrade head && JOBINTEL_DATABASE_URL=sqlite:///./ci.db alembic check
      - name: Parity fixtures are up to date
        run: python scripts/gen_parity_fixtures.py && git diff --exit-code ../shared/fixtures/parity.json
      - name: Docker image builds
        working-directory: .
        run: docker build -f backend/Dockerfile -t cipherpath-api .
