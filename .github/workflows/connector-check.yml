name: Live connector check

on:
  schedule:
    - cron: "15 2 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["shared/companies.json", "backend/app/connectors/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Query every seed board on the real public APIs
        working-directory: backend
        run: python scripts/live_connector_check.py
      - name: Publish report
        if: always()
        run: cat backend/connector-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-report
          path: backend/connector-report.md
