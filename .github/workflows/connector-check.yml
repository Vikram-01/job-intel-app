name: Live connector check

on:
  schedule:
    - cron: "15 2 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["shared/companies.json", "backend/app/connectors/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Query every seed board on the real public APIs
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/live_connector_check.py 2>&1 | tee /tmp/check.log || { echo "::error title=Connector check::$(tail -40 /tmp/check.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: Publish report
        if: always()
        run: |
          cat backend/connector-report.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "::notice title=Connector report::$(sed 's/%/%25/g' backend/connector-report.md | awk '{printf "%s%%0A", $0}')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connector-report
          path: backend/connector-report.md
